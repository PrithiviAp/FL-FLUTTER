name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # allows manual trigger from Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'   # change to your local Flutter version
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: family_locator   # ← if Flutter project is at repo root, delete this line
        run: flutter pub get

      - name: Build release APK
        working-directory: family_locator   # ← same as above
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: family_locator/build/app/outputs/flutter-apk/app-release.apk   # ← adjust path
          retention-days: 7
