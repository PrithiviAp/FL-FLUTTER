name: family_locator
description: Transparent family device locator. Persistent notification while tracking.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  flutter_foreground_task: ^8.10.4
  geolocator: ^12.0.0
  connectivity_plus: ^6.0.5
  flutter_recorder: ^1.0.0
  permission_handler: ^11.3.1
  dio: ^5.5.0
  shared_preferences: ^2.2.3
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.0
  web_socket_channel: ^3.0.1
  call_state: ^1.0.0         
  path_provider: ^2.1.4
  record: ^5.1.2    
  path: ^1.9.0
  call_log: ^6.0.0
  another_telephony: ^0.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true