buildscript {
    ext.kotlin_version = '1.9.24'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Single subprojects block: namespace fix + JVM target alignment + Java compileOptions.
// Both fixes must run in the same afterEvaluate pass so they can't conflict.
subprojects {
    // (a) Force JVM 17 for every Kotlin compile task in every plugin.
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
        }
    }

    afterEvaluate { project ->
        // (b) Ensure AGP 8.x namespace exists for plugins that omit it.
        if (project.plugins.hasPlugin("com.android.library")) {
            def androidExt = project.extensions.findByName('android')
            if (androidExt != null && androidExt.namespace == null) {
                def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    def manifestXml = new groovy.xml.XmlSlurper().parse(manifestFile)
                    def packageName = manifestXml.@package.text()
                    if (packageName) {
                        androidExt.namespace = packageName
                    }
                }
            }
        }

        // (c) Force Java 17 on any Android module (app + plugins) so it matches Kotlin 17.
        if (project.hasProperty('android')) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
